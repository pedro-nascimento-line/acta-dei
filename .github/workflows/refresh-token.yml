name: Renovar token do Instagram

# O token de longa duração vale 60 dias e pode ser renovado a partir de 24 h após a emissão.
# Renovamos toda semana e gravamos o novo valor no secret IG_ACCESS_TOKEN.
# Precisa do secret ACTIONS_PAT (token pessoal do GitHub com permissão de escrever secrets neste repositório).
on:
  schedule:
    - cron: "17 4 * * 1"   # segunda-feira, 01:17 BRT
  workflow_dispatch:

jobs:
  refresh:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install requests
      - name: Renovar e gravar
        env:
          IG_ACCESS_TOKEN: ${{ secrets.IG_ACCESS_TOKEN }}
          GH_TOKEN: ${{ secrets.ACTIONS_PAT }}
          IG_API_HOST: ${{ vars.IG_API_HOST }}
        run: |
          novo=$(python scripts/publish.py --refresh-token)
          echo "::add-mask::$novo"
          gh secret set IG_ACCESS_TOKEN --body "$novo" --repo "${{ github.repository }}"
          echo "token renovado em $(date -u)"
